# Config for GNU GRand Unified Bootloader (GRUB)
# /boot/grub/grub.cfg

insmod all_video
insmod font
insmod gfxterm

set gfxpayload=keep
if loadfont unicode; then
    set gfxterm_font=unicode
    terminal_output gfxterm
fi

set timeout=30

set default=0

set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-green

menuentry "Os (x86_64)" {
    multiboot /stage2.elf
    module /kernel.bin "kernel"
}

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
